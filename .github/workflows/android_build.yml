name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi (Contoh: Musik Sasak Offline)'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name (Contoh: com.ojgrup.musiksasak)'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di folder assets (Contoh: icon.png)'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App from Form
        run: |
          # Ambil data dari Form Input
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          echo "Mengubah nama menjadi: $NAME"
          sed -i "s/name=\"app_name\">Auxio/name=\"app_name\">$NAME/g" app/src/main/res/values/strings.xml
          
          echo "Mengubah package menjadi: $PACKAGE"
          sed -i "s/applicationId \"org.oxycblt.auxio\"/applicationId \"$PACKAGE\"/g" app/build.gradle
          
          # Cek file icon di folder assets
          if [ -f "assets/$ICON" ]; then
            echo "Mengganti icon menggunakan assets/$ICON"
            cp -f "assets/$ICON" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp -f "assets/$ICON" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          else
            echo "Icon $ICON tidak ditemukan di folder assets, pakai default."
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB
        run: ./gradlew assembleDebug bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
