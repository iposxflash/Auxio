name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi (Contoh: Musik Sasak Offline)'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name (Contoh: com.ojgrup.musiksasak)'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di folder assets (Contoh: icon.png)'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App Metadata
        run: |
          # 1. Ambil data dari Form Input
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          echo "--- KONFIGURASI BARU ---"
          echo "Nama Aplikasi: $NAME"
          echo "Package Name : $PACKAGE"
          echo "File Icon    : assets/$ICON"
          echo "-----------------------"

          # 2. Ubah Nama Aplikasi di strings.xml
          # Menggunakan regex yang lebih kuat untuk mencari tag app_name
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" app/src/main/res/values/strings.xml
          
          # 3. Ubah Package Name di app/build.gradle
          sed -i "s/applicationId \"org.oxycblt.auxio\"/applicationId \"$PACKAGE\"/g" app/build.gradle
          
          # 4. Ganti Icon di semua resolusi folder res
          if [ -f "assets/$ICON" ]; then
            echo "Proses mengganti icon..."
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f "assets/$ICON" "app/src/main/res/$folder/ic_launcher.png"
              cp -f "assets/$ICON" "app/src/main/res/$folder/ic_launcher_round.png"
            done
            echo "Icon berhasil diperbarui di semua folder mipmap."
          else
            echo "PERINGATAN: assets/$ICON tidak ditemukan. Menggunakan icon bawaan."
          fi
          
          # 5. Berikan izin eksekusi ke gradlew
          chmod +x gradlew

      - name: Build APK and AAB
        # assembleDebug = APK, bundleDebug = AAB
        run: ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
