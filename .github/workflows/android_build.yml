name: Build Custom Auxio (Final Solution)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # KUNCI UTAMA: Jangan ambil submodule secara otomatis agar tidak error 128
          submodules: false 
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Deep Clean and Force Fix
        run: |
          # 1. Matikan pengecekan submodule yang rusak
          git config --global core.quotepath false
          
          # 2. Hapus total referensi FFmpeg dan Taglib dari konfigurasi
          # Agar Gradle tidak mencoba mencarinya
          if [ -f "settings.gradle" ]; then
            sed -i "/decoder-ffmpeg/d" settings.gradle
            sed -i "/decoder_ffmpeg/d" settings.gradle
            sed -i "/musikr/d" settings.gradle
          fi

          # 3. Turunkan versi plugin agar stabil (dari 9.1.0 ke 8.2.2)
          find . -name "build.gradle*" -exec sed -i "s/9.1.0/8.2.2/g" {} +

          # 4. Kustomisasi Metadata
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # Ganti Nama Aplikasi
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # Ganti Package Name
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
            # Hapus dependensi modul yang rusak di dalam app
            sed -i "/:musikr/d" app/build.gradle
            sed -i "/decoder-ffmpeg/d" app/build.gradle
          fi

          # 5. Ganti Icon
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB
        # Kita abaikan sinkronisasi submodule dan langsung build modul utama
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
