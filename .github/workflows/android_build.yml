name: Build Custom Auxio (Final Fix)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false 

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Force Clean & Reset Settings
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # 1. RESET TOTAL SETTINGS.GRADLE (Menghilangkan error baris 22)
          # Kita buat file settings.gradle baru yang hanya berisi folder app
          echo "rootProject.name = 'Auxio'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "Settings.gradle has been reset to minimal."

          # 2. BERSIHKAN DEPENDENSI DI APP/BUILD.GRADLE
          # Karena modul lain dibuang, kita harus hapus panggilannya di dalam app
          if [ -f "app/build.gradle" ]; then
            sed -i "/project(':media/d" app/build.gradle
            sed -i "/project(':musikr/d" app/build.gradle
            sed -i "/decoder-ffmpeg/d" app/build.gradle
            
            # Ganti Package Name
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 3. GANTI NAMA APLIKASI
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 4. GANTI ICON
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB
        # Kita panggil build secara umum karena settings.gradle sudah sangat sederhana
        run: ./gradlew assembleDebug bundleDebug --no-daemon
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
