name: Build Custom Auxio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App Metadata
        run: |
          # 1. TEMPAT INPUT NAMA APLIKASI
          # Ganti "Musik Sasak Offline" dengan nama yang Anda mau
          APP_NAME="Musik Sasak Offline"
          sed -i "s/name=\"app_name\">Auxio/name=\"app_name\">$APP_NAME/g" app/src/main/res/values/strings.xml
          
          # 2. TEMPAT INPUT PACKAGE NAME
          # Ganti "com.ojgrup.musiksasak" dengan id aplikasi Anda (tanpa spasi)
          PACKAGE_NAME="com.ojgrup.musiksasak"
          sed -i "s/applicationId \"org.oxycblt.auxio\"/applicationId \"$PACKAGE_NAME\"/g" app/build.gradle
          
          # 3. TEMPAT INPUT ICON (Logika Otomatis)
          # Pastikan Anda sudah mengupload file bernama "icon.png" ke folder "assets" di Github Anda
          if [ -f "assets/icon.png" ]; then
            cp -f assets/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp -f assets/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "Icon berhasil diganti!"
          else
            echo "File assets/icon.png tidak ditemukan, menggunakan icon default."
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB
        run: ./gradlew assembleDebug bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-AAB
          path: app/build/outputs/bundle/debug/*.aab
