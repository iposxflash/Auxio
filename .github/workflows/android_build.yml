name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name (Gunakan titik, misal: com.sasak.musik)'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di folder assets (misal: icon.png)'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App Metadata
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # 1. Perbaikan Settings.gradle (Bypass baris 22)
          if [ -f "settings.gradle" ]; then
            sed -i "/core_settings.gradle/d" settings.gradle
          fi

          # 2. Ubah Nama Aplikasi (strings.xml)
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" app/src/main/res/values/strings.xml
          fi
          
          # 3. Ubah Package Name (applicationId)
          # Menggunakan cara yang lebih aman agar tidak merusak baris dependencies
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi
          
          # 4. Ganti Icon
          if [ -f "assets/$ICON" ]; then
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "app/src/main/res/$folder"
              cp -f "assets/$ICON" "app/src/main/res/$folder/ic_launcher.png"
              cp -f "assets/$ICON" "app/src/main/res/$folder/ic_launcher_round.png"
            done
          fi
          
          chmod +x gradlew

      - name: Build APK and AAB
        # Menggunakan wrapper bawaan proyek agar versi Gradle konsisten
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
