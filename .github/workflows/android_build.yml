name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name (Contoh: com.sasak.musik)'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di folder assets (misal: icon.png)'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # KUNCI PERBAIKAN: Jangan ambil submodule secara otomatis karena server FFmpeg error
          submodules: false 

      - name: Manual Submodule Sync
        run: |
          # Kita hanya ambil submodule yang penting (media), abaikan FFmpeg yang error
          git submodule init
          git submodule update --remote media || true
          echo "Submodule media diupdate, mengabaikan error ffmpeg jika ada."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App Metadata
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          echo "--- KUSTOMISASI MULAI ---"

          # 1. Pastikan settings.gradle tidak error meski submodule tidak lengkap
          if [ -f "settings.gradle" ]; then
            # Hapus baris yang memaksa penggunaan decoder ffmpeg jika menyebabkan build gagal
            sed -i "/decoder_ffmpeg/d" settings.gradle || true
          fi

          # 2. Ganti Nama Aplikasi
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 3. Ganti Package Name
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi
          
          # 4. Ganti Icon (Menimpa file asli)
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK and AAB
        # Gunakan --stacktrace untuk melihat detail jika tetap gagal
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace
