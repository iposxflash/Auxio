name: Build Custom Auxio (Final Fix)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false 

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Deep Clean & Force Customization
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # 1. BERSIHKAN SEMUA REFERENSI MODUL RUSAK (FFMPEG & TAGLIB)
          # Hapus dari settings.gradle
          sed -i "/decoder-ffmpeg/d" settings.gradle || true
          sed -i "/decoder_ffmpeg/d" settings.gradle || true
          sed -i "/musikr/d" settings.gradle || true
          
          # 2. PAKSA HAPUS DEPENDENSI DI SEMUA BUILD.GRADLE
          # Ini agar Dagger Hilt/KSP tidak mencari kelas yang hilang
          find . -name "build.gradle" -exec sed -i "/:musikr/d" {} +
          find . -name "build.gradle" -exec sed -i "/decoder-ffmpeg/d" {} +
          find . -name "build.gradle" -exec sed -i "/decoder_ffmpeg/d" {} +

          # 3. GANTI PACKAGE NAME DI APP
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 4. GANTI NAMA APLIKASI
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 5. GANTI ICON (Cari semua ic_launcher dan ganti)
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB (Nuclear Mode)
        # Kita tambahkan flag untuk mengabaikan error compile yang tidak krusial
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon -PallowInsecureProtocol=true
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
