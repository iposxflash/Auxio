name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name (Gunakan titik, misal: com.sasak.musik)'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di folder assets (misal: icon.png)'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Penting jika Auxio menggunakan submodules

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App Metadata
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          echo "--- MEMULAI KUSTOMISASI AMAN ---"

          # 1. JANGAN HAPUS ISI SETTINGS.GRADLE
          # Kita hanya pastikan file tersebut ada. Jangan gunakan 'sed' yang menghapus baris 'include'
          if [ -f "settings.gradle" ]; then
            echo "Checking settings.gradle... OK"
          fi

          # 2. Ubah Nama Aplikasi (strings.xml)
          # Mencari tag app_name tanpa merusak struktur XML
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 3. Ubah Package Name (applicationId) secara hati-hati
          # Kita hanya mengubah di folder app/build.gradle pada baris applicationId
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
            echo "Package name berhasil diubah."
          fi
          
          # 4. Ganti Icon (Menimpa file asli)
          if [ -f "assets/$ICON" ]; then
            echo "Proses ganti icon..."
            # Mencari folder mipmap secara otomatis dan menimpa icon
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK and AAB
        # Menggunakan --continue agar jika ada error non-critical build tetap jalan
        # Menggunakan ./gradlew (wrapper) agar versi gradle tidak lompat ke 9.3
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon
