name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # Kita tangani secara manual

      - name: Manual Submodule Prep
        run: |
          git submodule init
          git submodule update --remote media || true
          # Kita abaikan update taglib karena sering error di server

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize and Fix Build
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # 1. DISABLE SEMUA MODUL BERMASALAH (FFmpeg & Taglib)
          if [ -f "settings.gradle" ]; then
            # Hapus referensi decoder ffmpeg
            sed -i "/decoder-ffmpeg/d" settings.gradle
            sed -i "/decoder_ffmpeg/d" settings.gradle
            # Hapus referensi musikr/taglib jika ada di settings
            sed -i "/musikr/d" settings.gradle || true
          fi
          
          # 2. Bersihkan Dependensi di app/build.gradle
          if [ -f "app/build.gradle" ]; then
            # Hapus dependensi ke modul musikr yang gagal compile taglib
            sed -i "/:musikr/d" app/build.gradle
            sed -i "/decoder-ffmpeg/d" app/build.gradle
            
            # Ganti Package Name
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 3. Ubah Nama Aplikasi
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 4. Ganti Icon
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK and AAB
        # -x :musikr:assembleTaglib mengecualikan proses compile taglib yang error
        # -x :media-lib-decoder-ffmpeg:assembleFfmpeg mengecualikan FFmpeg yang error
        run: ./gradlew :app:assembleDebug :app:bundleDebug -x :media-lib-decoder-ffmpeg:assembleFfmpeg -x :musikr:assembleTaglib --no-daemon
        
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
