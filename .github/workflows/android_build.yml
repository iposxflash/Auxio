name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # Kita kontrol manual

      - name: Manual Submodule Prep
        run: |
          git submodule init
          # Kita hanya ambil folder media, abaikan ffmpeg/taglib yang rusak di server
          git submodule update --remote media || true
          
          # BUAT DUMMY TAGLIB (PENTING!)
          # Ini agar modul :musikr tetap ada tapi tidak mencoba compile C++ yang error
          mkdir -p musikr/src/main/cpp/taglib
          touch musikr/src/main/cpp/taglib/CMakeLists.txt
          echo "project(dummy)" > musikr/src/main/cpp/taglib/CMakeLists.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize and Fix Build
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # 1. PERBAIKAN SETTINGS (Jangan hapus :musikr!)
          if [ -f "settings.gradle" ]; then
            # Hanya hapus ffmpeg yang memang tidak krusial bagi kode Kotlin
            sed -i "/decoder-ffmpeg/d" settings.gradle
            sed -i "/decoder_ffmpeg/d" settings.gradle
          fi
          
          # 2. KONFIGURASI APP
          if [ -f "app/build.gradle" ]; then
            sed -i "/decoder-ffmpeg/d" app/build.gradle
            sed -i "/decoder_ffmpeg/d" app/build.gradle
            # Ganti Package Name
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 3. GANTI NAMA & ICON
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK and AAB
        # Kita skip task C++ (assembleTaglib dan assembleFfmpeg) agar tidak error
        run: ./gradlew :app:assembleDebug :app:bundleDebug -x :musikr:assembleTaglib -x :media-lib-decoder-ffmpeg:assembleFfmpeg --no-daemon
        
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
