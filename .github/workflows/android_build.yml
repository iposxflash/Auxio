name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # Matikan submodule otomatis

      - name: Manual Submodule Prep
        run: |
          git submodule init
          git submodule update --remote media || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Deep Clean and Customize
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # 1. BERSIHKAN SETTINGS.GRADLE TOTAL
          # Menghapus semua baris yang mengandung modul bermasalah agar Gradle tidak mencarinya
          if [ -f "settings.gradle" ]; then
            sed -i "/decoder-ffmpeg/d" settings.gradle
            sed -i "/decoder_ffmpeg/d" settings.gradle
            sed -i "/musikr/d" settings.gradle
            echo "Settings.gradle cleaned."
          fi
          
          # 2. BERSIHKAN DEPENDENSI DI APP/BUILD.GRADLE
          if [ -f "app/build.gradle" ]; then
            # Hapus kaitan ke modul yang kita buang
            sed -i "/:musikr/d" app/build.gradle
            sed -i "/decoder-ffmpeg/d" app/build.gradle
            sed -i "/decoder_ffmpeg/d" app/build.gradle
            
            # Ganti Package Name
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 3. GANTI NAMA APLIKASI
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 4. GANTI ICON
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK and AAB
        # HANYA jalankan build app utama. 
        # Kita tidak perlu lagi -x karena modulnya sudah dibuang dari settings.gradle
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon
        
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
