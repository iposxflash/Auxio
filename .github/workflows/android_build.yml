name: Build Custom Auxio (Final Solution)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Kita coba ambil lagi secara aman

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Dependencies and Versions
        run: |
          # 1. FIX PLUGIN VERSION (Solusi Error Plugin 9.1.0)
          # Kita paksa turunkan ke versi 8.2.2 yang stabil di server Google
          find . -name "build.gradle" -exec sed -i "s/9.1.0/8.2.2/g" {} +
          find . -name "build.gradle.kts" -exec sed -i "s/9.1.0/8.2.2/g" {} +

          # 2. FIX SETTINGS.GRADLE
          # Jika file media/core_settings.gradle hilang, kita matikan baris pemanggilnya
          if [ ! -f "media/core_settings.gradle" ]; then
            sed -i "/core_settings.gradle/d" settings.gradle || true
          fi

          # 3. CUSTOMIZE METADATA
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          # Ganti Nama App
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # Ganti Package Name
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 4. GANTI ICON
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB
        # Gunakan --no-daemon dan paksa gunakan repositori Google
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
