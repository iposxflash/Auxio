name: Build Custom Auxio (Absolute Fix)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Force Reconstruction of Build Files
        run: |
          # 1. REKONSTRUKSI SETTINGS.GRADLE (Pusat Kendali Repository)
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Auxio'
          include ':app'
          EOF

          # 2. REKONSTRUKSI ROOT BUILD.GRADLE (Hanya untuk Classpath)
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          // Kita kosongkan allprojects agar tidak bentrok dengan settings.gradle
          EOF

          # 3. BERSIHKAN APP BUILD.GRADLE
          if [ -f "app/build.gradle" ]; then
            sed -i "/project(':media/d" app/build.gradle
            sed -i "/project(':musikr/d" app/build.gradle
            sed -i "/decoder-ffmpeg/d" app/build.gradle
            
            # Ganti Package Name
            PACKAGE="${{ github.event.inputs.package_name }}"
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 4. CUSTOMIZE METADATA (Nama Aplikasi)
          NAME="${{ github.event.inputs.app_name }}"
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 5. GANTI ICON
          ICON="${{ github.event.inputs.icon_path }}"
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
