name: Build Custom Auxio (Final Solution)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di assets/'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false # Matikan submodule agar tidak error git 128
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Force Recreate Settings.gradle
        run: |
          # Hapus file lama yang bermasalah
          rm -f settings.gradle
          
          # Buat file baru dari nol (Tanpa baris 22 yang error)
          echo "rootProject.name = 'Auxio'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          echo "File settings.gradle telah dibuat ulang dengan sukses."

      - name: Deep Clean App Dependencies
        run: |
          # 1. Ganti versi plugin ke 8.2.2 agar tersedia di server Google
          find . -name "build.gradle*" -exec sed -i "s/9.1.0/8.2.2/g" {} +
          
          # 2. Bersihkan app/build.gradle dari dependensi modul yang sudah kita buang
          if [ -f "app/build.gradle" ]; then
            sed -i "/project(':media/d" app/build.gradle
            sed -i "/project(':musikr/d" app/build.gradle
            sed -i "/decoder-ffmpeg/d" app/build.gradle
            
            # Ganti Package Name
            PACKAGE="${{ github.event.inputs.package_name }}"
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
          fi

          # 3. Ganti Nama Aplikasi
          NAME="${{ github.event.inputs.app_name }}"
          find app/src/main/res -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" {} +
          
          # 4. Ganti Icon
          ICON="${{ github.event.inputs.icon_path }}"
          if [ -f "assets/$ICON" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp -f "assets/$ICON" {} \;
            find app/src/main/res -name "ic_launcher_round.png" -exec cp -f "assets/$ICON" {} \;
          fi
          
          chmod +x gradlew

      - name: Build APK & AAB
        # Build hanya modul :app karena modul lain sudah kita hilangkan
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
