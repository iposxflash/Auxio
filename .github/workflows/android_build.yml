name: Build Custom Auxio (Manual Form)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi (Contoh: Musik Sasak Offline)'
        required: true
        default: 'Musik Sasak'
      package_name:
        description: 'Package Name (Contoh: com.ojgrup.musiksasak)'
        required: true
        default: 'com.ojgrup.musiksasak'
      icon_path:
        description: 'Nama file icon di folder assets (Contoh: icon.png)'
        required: false
        default: 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Customize App Metadata
        run: |
          # 1. Ambil data dari Form Input
          NAME="${{ github.event.inputs.app_name }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          ICON="${{ github.event.inputs.icon_path }}"

          echo "--- MEMULAI KUSTOMISASI ---"

          # 2. FIX ERROR BARIS 22 (Settings.gradle)
          # Menghapus baris 'apply from' jika file target tidak ditemukan agar build tidak FAILED
          if [ ! -f "media/core_settings.gradle" ]; then
            echo "PERINGATAN: media/core_settings.gradle hilang. Membersihkan settings.gradle..."
            sed -i "/core_settings.gradle/d" settings.gradle
          fi

          # 3. Ubah Nama Aplikasi di strings.xml
          # Mencari tag app_name dan menggantinya dengan input dari user
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NAME<\/string>/g" app/src/main/res/values/strings.xml
            echo "Nama aplikasi diubah menjadi: $NAME"
          fi
          
          # 4. Ubah Package Name (applicationId) di app/build.gradle
          if [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId [\"'].*[\"']/applicationId \"$PACKAGE\"/g" app/build.gradle
            echo "Package name diubah menjadi: $PACKAGE"
          fi
          
          # 5. Ganti Icon Aplikasi
          # Mengambil file dari folder assets/ dan menimpa icon bawaan di semua resolusi
          if [ -f "assets/$ICON" ]; then
            echo "Mengganti icon menggunakan assets/$ICON..."
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "app/src/main/res/$folder"
              cp -f "assets/$ICON" "app/src/main/res/$folder/ic_launcher.png"
              cp -f "assets/$ICON" "app/src/main/res/$folder/ic_launcher_round.png"
            done
          else
            echo "INFO: assets/$ICON tidak ditemukan. Build dilanjutkan dengan icon default."
          fi
          
          # 6. Berikan izin eksekusi gradlew
          chmod +x gradlew

      - name: Build APK and AAB
        # Melakukan build dua format sekaligus
        run: ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-AAB
          path: app/build/outputs/bundle/debug/*.aab
